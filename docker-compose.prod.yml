services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: recipes
      POSTGRES_USER: recipes
      POSTGRES_PASSWORD: recipes_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  api:
    image: baubert/recipe-shop-api:latest
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgres://recipes:recipes_pass@db:5432/recipes
    ports:
      - "3001:3001"
    depends_on:
      - db

  frontend:
    image: baubert/recipe-shop-frontend:latest
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  pgdata:
